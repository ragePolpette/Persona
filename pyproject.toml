[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona"
version = "0.2.0"
description = "Anonymize documents before sharing them with an AI, then restore the AI's output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gianmarco" }]
dependencies = [
  "typer>=0.16,<1.0",
  "cryptography>=44.0",
  "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9.0"]

[project.scripts]
persona = "persona.cli:app"

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
