[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "persona"
version = "0.2.0"
description = "Anonymize documents before sharing them with an AI, then restore the AI's output."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gianmarco" }]
dependencies = [
  "typer>=0.16,<1.0",
  "cryptography>=44.0",
  "argon2-cffi>=23.1",
  "lxml>=5.0",
]

[project.optional-dependencies]
pdf = ["pdfplumber>=0.11,<1.0"]
dev = [
  "pytest>=9.1.1,<10.0",
  "pdfplumber>=0.11,<1.0",
  "reportlab>=4.2,<5.0",
  "python-docx>=1.1,<2.0",
  "openpyxl>=3.1,<4.0",
  "ruff>=0.17,<0.18",
]

[project.scripts]
persona = "persona.cli:app"

[tool.setuptools.packages.find]
include = ["persona*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# B008: typer declares options as default values by design.
# E501: long regexes and test strings read better unwrapped; no formatter is enforced.
# RUF001: the detectors deliberately match typographic characters such as ’ and –.
ignore = ["B008", "E501", "RUF001"]

[tool.ruff.lint.per-file-ignores]
# the first-name gazetteer is a whitespace-separated word list on purpose
"persona/detect/names.py" = ["SIM905"]
